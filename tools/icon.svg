<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -9 137 137">
  <!-- KoeStudio app icon: a chubby cow ("koe") holding a paint palette, in the style of the BiggTaal and
       Varken Sketchpad pigs (soft flat shapes, no tile), with a dark outline all round so it stands out on light
       backgrounds too. tools/make_icon.mjs renders it. -->
  <defs>
    <clipPath id="body"><ellipse cx="60" cy="70" rx="52" ry="40"/></clipPath>
    <!-- the outline: the shape's alpha blurred and cut off low, so it grows by ~4 units with round corners -->
    <filter id="outline" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feComponentTransfer result="grown"><feFuncA type="linear" slope="30" intercept="-1.2"/></feComponentTransfer>
      <feFlood flood-color="#4a302b"/>
      <feComposite in2="grown" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#outline)">
  <!-- feet -->
  <ellipse cx="42" cy="106" rx="11" ry="6.4" fill="#8d6e63"/><ellipse cx="78" cy="106" rx="11" ry="6.4" fill="#8d6e63"/>
  <!-- horns -->
  <path d="M38 36 Q30 22 36 12 Q46 20 50 32 Z" fill="#ffe2a0"/>
  <path d="M82 36 Q90 22 84 12 Q74 20 70 32 Z" fill="#ffe2a0"/>
  <!-- ears, sticking out sideways -->
  <path d="M22 46 Q9 39 3 46 Q9 58 26 58 Z" fill="#f6e6dc"/><path d="M20 49 Q11 45 8 49 Q13 55 22 55 Z" fill="#ffb7bd"/>
  <path d="M98 46 Q111 39 117 46 Q111 58 94 58 Z" fill="#f6e6dc"/><path d="M100 49 Q109 45 112 49 Q107 55 98 55 Z" fill="#ffb7bd"/>
  <!-- body and head in one, with soft gray patches -->
  <ellipse cx="60" cy="70" rx="52" ry="40" fill="#fff8f2" stroke="#ecd6c8" stroke-width="2.4"/>
  <g clip-path="url(#body)" fill="#86858f">
    <path d="M70 28 Q90 26 104 40 Q110 52 102 58 Q92 60 86 52 Q76 50 74 42 Q66 38 70 28 Z"/>
    <path d="M6 74 Q18 66 26 76 Q28 90 16 94 Q6 92 6 74 Z"/>
    <ellipse cx="44" cy="36" rx="7" ry="5"/>
  </g>
  <ellipse cx="60" cy="86" rx="34" ry="20" fill="#ffffff" opacity=".6"/>
  <!-- tuft -->
  <path d="M52 32 Q55 22 60 30 Q63 20 68 30" fill="none" stroke="#86858f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes and cheeks, as on the pigs -->
  <ellipse cx="43" cy="60" rx="5.8" ry="6.6" fill="#3a1a22"/><circle cx="41.4" cy="57.6" r="2.3" fill="#fff"/><circle cx="45" cy="62.6" r="1.1" fill="#fff" opacity=".85"/>
  <ellipse cx="77" cy="60" rx="5.8" ry="6.6" fill="#3a1a22"/><circle cx="75.4" cy="57.6" r="2.3" fill="#fff"/><circle cx="79" cy="62.6" r="1.1" fill="#fff" opacity=".85"/>
  <ellipse cx="27" cy="72" rx="9" ry="5.6" fill="#ff9d9a" opacity=".75"/><ellipse cx="93" cy="72" rx="9" ry="5.6" fill="#ff9d9a" opacity=".75"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="75" rx="17" ry="10" fill="#ffc3c9"/>
  <ellipse cx="54" cy="74" rx="2.2" ry="3" fill="#d9707f"/><ellipse cx="66" cy="74" rx="2.2" ry="3" fill="#d9707f"/>
  <!-- paint palette held in front -->
  <g transform="rotate(-6 60 96)">
    <path d="M34 92 Q36 82 56 82 Q86 82 88 96 Q90 110 72 112 Q64 112 62 106 Q60 100 52 104 Q38 110 34 102 Z" fill="#ffe6b0"/>
    <ellipse cx="45" cy="96" rx="3.6" ry="3" fill="#f2c98a"/>
    <circle cx="56" cy="89" r="4" fill="#ff6f8a"/><circle cx="67" cy="88" r="4" fill="#5fb8ff"/>
    <circle cx="77" cy="93" r="4" fill="#ffcc3d"/><circle cx="76" cy="104" r="4" fill="#6fd99a"/>
  </g>
  <!-- hooves holding it -->
  <ellipse cx="29" cy="95" rx="7.5" ry="9.5" transform="rotate(-24 29 95)" fill="#fff1e8" stroke="#ecd6c8" stroke-width="2"/>
  <!-- brush held up in the right hoof, bristles out past the body -->
  <g transform="translate(92 94) rotate(32)">
    <rect x="-3" y="-40" width="6" height="34" rx="3" fill="#c98b5a"/>
    <rect x="-3.6" y="-46" width="7.2" height="7" rx="1.5" fill="#d7dbe4"/>
    <path d="M-3.6 -46 q-1 -8 3.6 -14 q4.6 6 3.6 14 z" fill="#ff6f8a"/>
  </g>
  <ellipse cx="91" cy="95" rx="7.5" ry="9.5" transform="rotate(24 91 95)" fill="#fff1e8" stroke="#ecd6c8" stroke-width="2"/>
</g>
</svg>
