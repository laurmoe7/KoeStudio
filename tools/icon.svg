<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 120 124">
  <!-- KoeStudio app icon: a chubby cow ("koe") holding a paint palette, in the style of the BiggTaal and
       Varken Sketchpad pigs (soft flat shapes, no tile). Strong colours rather than an outline make it stand out on
       light backgrounds: grey spots, small pale pink horns, outlined ears (one grey), dark hooves, a warm shaded edge on the body and a shadow under the feet.
       The palette is held up at the side, clear of the feet. tools/make_icon.mjs renders it. -->
  <defs>
    <clipPath id="body"><ellipse cx="60" cy="70" rx="52" ry="40"/></clipPath>
  </defs>
  <!-- shadow on the ground -->
  <ellipse cx="60" cy="113" rx="42" ry="5" fill="#3a1a22" opacity=".2"/>
  <!-- feet: dark hooves with a cleft and a shine -->
  <g stroke-linecap="round">
    <ellipse cx="41" cy="106" rx="12.5" ry="7.2" fill="#5d4037" stroke="#3e2723" stroke-width="2"/>
    <ellipse cx="79" cy="106" rx="12.5" ry="7.2" fill="#5d4037" stroke="#3e2723" stroke-width="2"/>
    <path d="M41 108 V113 M79 108 V113" stroke="#3e2723" stroke-width="2"/>
  </g>
  <!-- horns: small rounded pink nubs leaning outwards, a deeper pink band at the base and a soft shine -->
  <path d="M37.5 37 C33 31 33 24 37.5 21.5 C42 19.5 46.5 23 48 28.5 L50 34 Z" fill="#ffd3df" stroke="#f0a3b9" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M82.5 37 C87 31 87 24 82.5 21.5 C78 19.5 73.5 23 72 28.5 L70 34 Z" fill="#ffd3df" stroke="#f0a3b9" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M36.5 35.5 Q35.5 32 36.6 30.5 Q43 31 48.6 30.4 L50 34 Q44 37 37.5 37 Z" fill="#f9b2c6"/>
  <path d="M83.5 35.5 Q84.5 32 83.4 30.5 Q77 31 71.4 30.4 L70 34 Q76 37 82.5 37 Z" fill="#f9b2c6"/>
  <ellipse cx="39.3" cy="24.6" rx="1.7" ry="2.4" transform="rotate(-25 39.3 24.6)" fill="#fff" opacity=".7"/>
  <ellipse cx="80.7" cy="24.6" rx="1.7" ry="2.4" transform="rotate(25 80.7 24.6)" fill="#fff" opacity=".7"/>
  <!-- ears, sticking out sideways and drooping a little, outlined like the body so they stand out -->
  <path d="M24 44 Q8 34 1 44 Q4 58 27 60 Z" fill="#fff4ea" stroke="#d9b39b" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M21 47.5 Q10 41 6 46 Q9 55 23 56 Z" fill="#ff9fb2"/>
  <path d="M96 44 Q112 34 119 44 Q116 58 93 60 Z" fill="#86858f" stroke="#6d6c76" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M99 47.5 Q110 41 114 46 Q111 55 97 56 Z" fill="#ff9fb2"/>
  <!-- body and head in one: cream with a warm shade along the bottom, grey patches -->
  <ellipse cx="60" cy="70" rx="52" ry="40" fill="#fffaf4"/>
  <g clip-path="url(#body)">
    <ellipse cx="60" cy="118" rx="66" ry="30" fill="#f3dccb"/>
    <!-- soft cow spots: a big one over the right eye, a few smaller ones round the body -->
    <g fill="#86858f">
      <path d="M66 31 C74 25 92 26 101 35 C108 42 107 53 99 57 C93 60 88 55 85 51 C81 47 74 49 70 44 C66 40 62 35 66 31 Z"/>
      <path d="M30 38 C34 33 43 33 45 38 C47 43 41 47 35 46 C29 45 27 42 30 38 Z"/>
      <circle cx="53" cy="38" r="2.6"/>
      <path d="M62 95 C66 90 76 90 78 95 C80 101 72 104 67 103 C62 102 59 99 62 95 Z"/>
      <path d="M101 79 C106 75 114 78 115 86 C115 93 109 97 104 95 C99 92 97 84 101 79 Z"/>
    </g>
  </g>
  <ellipse cx="60" cy="70" rx="52" ry="40" fill="none" stroke="#d9b39b" stroke-width="2.6"/>
  <!-- eyes and cheeks, as on the pigs -->
  <ellipse cx="43" cy="60" rx="6" ry="6.9" fill="#2a1218"/><circle cx="41.3" cy="57.4" r="2.4" fill="#fff"/><circle cx="45" cy="62.7" r="1.1" fill="#fff" opacity=".85"/>
  <ellipse cx="77" cy="60" rx="6" ry="6.9" fill="#2a1218"/><circle cx="75.3" cy="57.4" r="2.4" fill="#fff"/><circle cx="79" cy="62.7" r="1.1" fill="#fff" opacity=".85"/>
  <ellipse cx="27" cy="72" rx="9" ry="5.6" fill="#ff7f86" opacity=".8"/><ellipse cx="93" cy="72" rx="9" ry="5.6" fill="#ff7f86" opacity=".8"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="75" rx="17" ry="10" fill="#ffadb8"/>
  <ellipse cx="54" cy="74" rx="2.3" ry="3.1" fill="#c94f66"/><ellipse cx="66" cy="74" rx="2.3" ry="3.1" fill="#c94f66"/>
  <!-- paint palette held up at his side in the left hoof -->
  <!-- a classic artist's palette: a rounded oval with a thumb notch cut into one end, a thumb hole beside it
       and blobs of paint round the wide end -->
  <g transform="translate(23 84) rotate(-20) scale(.78)">
    <path d="M2 -20 C18 -20 30 -10 29 2 C28 14 16 21 1 21 C-14 21 -27 13 -28 2 C-28.5 -4 -25 -8 -20 -7
             C-15 -6 -12 -9 -14 -13 C-15 -17 -9 -20 2 -20 Z" fill="#f7c873" stroke="#d99a3c" stroke-width="2"/>
    <path d="M-24 10 C-16 18 0 20 14 16" fill="none" stroke="#e6ad55" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="-16" cy="3" rx="4.2" ry="3.6" fill="#d99a3c"/>
    <circle cx="-2" cy="-12" r="4.4" fill="#ff4f74"/><circle cx="10" cy="-11" r="4.4" fill="#2f9cff"/>
    <circle cx="20" cy="-3" r="4.4" fill="#ffb800"/><circle cx="19" cy="9" r="4.4" fill="#2fc874"/>
    <circle cx="6" cy="12" r="4.4" fill="#a66bff"/>
  </g>
  <!-- the hoof holding it from below -->
  <g transform="rotate(-20 28 96)" stroke-linecap="round">
    <clipPath id="hoofL"><rect x="18" y="97" width="20" height="14"/></clipPath>
    <ellipse cx="28" cy="96" rx="8.5" ry="10" fill="#fff4ea" stroke="#d9b39b" stroke-width="2"/>
    <g clip-path="url(#hoofL)">
      <ellipse cx="28" cy="96" rx="8.5" ry="10" fill="#6d4c41" stroke="#3e2723" stroke-width="2"/>
      <path d="M19.5 97 H36.5 M28 97 V105.5" stroke="#3e2723" stroke-width="1.8"/>
    </g>
  </g>
  <!-- brush held up in the right hoof, bristles out past the body -->
  <g transform="translate(92 94) rotate(32)">
    <rect x="-3" y="-40" width="6" height="34" rx="3" fill="#b06a35"/>
    <rect x="-3.6" y="-46" width="7.2" height="7" rx="1.5" fill="#b9c0cf"/>
    <path d="M-3.6 -46 q-1 -8 3.6 -14 q4.6 6 3.6 14 z" fill="#ff3f6c"/>
  </g>
  <g transform="rotate(24 91 96)" stroke-linecap="round">
    <clipPath id="hoofR"><rect x="81" y="97" width="20" height="14"/></clipPath>
    <ellipse cx="91" cy="96" rx="8.5" ry="10.5" fill="#fff4ea" stroke="#d9b39b" stroke-width="2"/>
    <g clip-path="url(#hoofR)">
      <ellipse cx="91" cy="96" rx="8.5" ry="10.5" fill="#6d4c41" stroke="#3e2723" stroke-width="2"/>
      <path d="M82.5 97 H99.5 M91 97 V106.0" stroke="#3e2723" stroke-width="1.8"/>
    </g>
  </g>
</svg>
