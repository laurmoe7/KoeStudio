<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- KoeStudio app icon: a cow ("koe") with a paintbrush, on a sky-to-meadow tile. tools/make_icon.mjs renders it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#a9dcff"/><stop offset=".55" stop-color="#c9ecff"/><stop offset=".56" stop-color="#bdecae"/><stop offset="1" stop-color="#8fd88f"/>
    </linearGradient>
    <clipPath id="head"><ellipse cx="76" cy="90" rx="50" ry="43"/></clipPath>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#tile)"/>
  <ellipse cx="76" cy="140" rx="48" ry="8" fill="#ffffff" fill-opacity=".55"/>

  <!-- horns -->
  <path d="M44 56 Q34 40 40 28 Q50 38 58 50 Z" fill="#fff4d8" stroke="#5b4239" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M108 56 Q118 40 112 28 Q102 38 94 50 Z" fill="#fff4d8" stroke="#5b4239" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- ears -->
  <path d="M34 70 Q14 62 8 74 Q18 88 38 84 Z" fill="#ffffff" stroke="#5b4239" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M30 74 Q20 71 16 76 Q22 82 32 81 Z" fill="#ffb3c4"/>
  <path d="M118 70 Q138 62 144 74 Q134 88 114 84 Z" fill="#ffffff" stroke="#5b4239" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M122 74 Q132 71 136 76 Q130 82 120 81 Z" fill="#ffb3c4"/>

  <!-- head with patches -->
  <ellipse cx="76" cy="90" rx="50" ry="43" fill="#ffffff"/>
  <g clip-path="url(#head)" fill="#4f3b35">
    <path d="M86 44 Q100 40 118 52 Q128 64 124 78 Q112 80 104 72 Q92 70 92 60 Q82 54 86 44 Z"/>
    <path d="M24 92 Q36 86 42 96 Q44 108 34 112 Q24 110 24 92 Z"/>
    <circle cx="60" cy="54" r="7"/>
  </g>
  <ellipse cx="76" cy="90" rx="50" ry="43" fill="none" stroke="#5b4239" stroke-width="3.6"/>
  <!-- tuft -->
  <path d="M66 50 Q70 40 76 48 Q80 38 86 48" fill="none" stroke="#5b4239" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- face -->
  <ellipse cx="38" cy="96" rx="9" ry="5.6" fill="#ff8fab" opacity=".7"/>
  <ellipse cx="114" cy="96" rx="9" ry="5.6" fill="#ff8fab" opacity=".7"/>
  <ellipse cx="54" cy="82" rx="5.6" ry="6.6" fill="#3d2b26"/><circle cx="52.2" cy="79.4" r="2.1" fill="#fff"/>
  <ellipse cx="98" cy="82" rx="5.6" ry="6.6" fill="#3d2b26"/><circle cx="96.2" cy="79.4" r="2.1" fill="#fff"/>
  <ellipse cx="76" cy="112" rx="30" ry="17" fill="#ffc4d2" stroke="#5b4239" stroke-width="3.2"/>
  <ellipse cx="65" cy="110" rx="3.6" ry="5" fill="#5b4239"/>
  <ellipse cx="87" cy="110" rx="3.6" ry="5" fill="#5b4239"/>
  <path d="M70 121 Q76 125 82 121" fill="none" stroke="#5b4239" stroke-width="2.6" stroke-linecap="round"/>

  <!-- paintbrush -->
  <g transform="rotate(36 130 54)">
    <rect x="124" y="6" width="12" height="46" rx="5" fill="#ffd34d" stroke="#5b4239" stroke-width="3" stroke-linejoin="round"/>
    <rect x="122" y="50" width="16" height="12" rx="2" fill="#cfd6e4" stroke="#5b4239" stroke-width="3" stroke-linejoin="round"/>
    <path d="M122 62 h16 q2 12 -8 24 q-10 -12 -8 -24 z" fill="#ff7fa3" stroke="#5b4239" stroke-width="3" stroke-linejoin="round"/>
    <path d="M126 64 q0 8 4 14" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
