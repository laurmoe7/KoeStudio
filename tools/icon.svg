<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 120 124">
  <!-- KoeStudio app icon: a chubby cow ("koe") holding a paint palette, in the style of the BiggTaal and
       Varken Sketchpad pigs (soft flat shapes, no tile). Strong colours rather than an outline make it stand out on
       light backgrounds: grey patches, golden horns, a warm shaded edge on the body and a shadow under the feet.
       The palette is held up at the side, clear of the feet. tools/make_icon.mjs renders it. -->
  <defs>
    <clipPath id="body"><ellipse cx="60" cy="70" rx="52" ry="40"/></clipPath>
  </defs>
  <!-- shadow on the ground -->
  <ellipse cx="60" cy="113" rx="42" ry="5" fill="#3a1a22" opacity=".2"/>
  <!-- feet -->
  <ellipse cx="42" cy="106" rx="11" ry="6.4" fill="#5d4037"/><ellipse cx="78" cy="106" rx="11" ry="6.4" fill="#5d4037"/>
  <!-- horns, golden with a darker base -->
  <path d="M38 36 Q30 22 36 12 Q46 20 50 32 Z" fill="#ffc94a"/>
  <path d="M82 36 Q90 22 84 12 Q74 20 70 32 Z" fill="#ffc94a"/>
  <path d="M38 36 Q35 31 36 28 Q43 29 48 30 L50 32 Z" fill="#e39a2d"/>
  <path d="M82 36 Q85 31 84 28 Q77 29 72 30 L70 32 Z" fill="#e39a2d"/>
  <!-- ears, sticking out sideways -->
  <path d="M22 46 Q9 39 3 46 Q9 58 26 58 Z" fill="#f2dccd"/><path d="M20 49 Q11 45 8 49 Q13 55 22 55 Z" fill="#ff8fa0"/>
  <path d="M98 46 Q111 39 117 46 Q111 58 94 58 Z" fill="#f2dccd"/><path d="M100 49 Q109 45 112 49 Q107 55 98 55 Z" fill="#ff8fa0"/>
  <!-- body and head in one: cream with a warm shade along the bottom, grey patches -->
  <ellipse cx="60" cy="70" rx="52" ry="40" fill="#fffaf4"/>
  <g clip-path="url(#body)">
    <ellipse cx="60" cy="118" rx="66" ry="30" fill="#f3dccb"/>
    <g fill="#86858f">
      <path d="M70 28 Q90 26 104 40 Q110 52 102 58 Q92 60 86 52 Q76 50 74 42 Q66 38 70 28 Z"/>
      <path d="M38 92 Q48 86 56 92 Q58 102 48 104 Q38 102 38 92 Z"/>
      <ellipse cx="44" cy="36" rx="7" ry="5"/>
      <path d="M100 82 Q110 78 114 86 Q112 98 104 98 Q96 94 100 82 Z"/>
    </g>
  </g>
  <ellipse cx="60" cy="70" rx="52" ry="40" fill="none" stroke="#d9b39b" stroke-width="2.6"/>
  <!-- eyes and cheeks, as on the pigs -->
  <ellipse cx="43" cy="60" rx="6" ry="6.9" fill="#2a1218"/><circle cx="41.3" cy="57.4" r="2.4" fill="#fff"/><circle cx="45" cy="62.7" r="1.1" fill="#fff" opacity=".85"/>
  <ellipse cx="77" cy="60" rx="6" ry="6.9" fill="#2a1218"/><circle cx="75.3" cy="57.4" r="2.4" fill="#fff"/><circle cx="79" cy="62.7" r="1.1" fill="#fff" opacity=".85"/>
  <ellipse cx="27" cy="72" rx="9" ry="5.6" fill="#ff7f86" opacity=".8"/><ellipse cx="93" cy="72" rx="9" ry="5.6" fill="#ff7f86" opacity=".8"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="75" rx="17" ry="10" fill="#ffadb8"/>
  <ellipse cx="54" cy="74" rx="2.3" ry="3.1" fill="#c94f66"/><ellipse cx="66" cy="74" rx="2.3" ry="3.1" fill="#c94f66"/>
  <!-- paint palette held up at his side in the left hoof -->
  <g transform="translate(23 84) rotate(-30) scale(.8) translate(-61 -97)">
    <path d="M34 92 Q36 82 56 82 Q86 82 88 96 Q90 110 72 112 Q64 112 62 106 Q60 100 52 104 Q38 110 34 102 Z" fill="#f7c873" stroke="#d99a3c" stroke-width="1.6"/>
    <ellipse cx="45" cy="96" rx="3.6" ry="3" fill="#d99a3c"/>
    <circle cx="56" cy="89" r="4.2" fill="#ff4f74"/><circle cx="67" cy="88" r="4.2" fill="#2f9cff"/>
    <circle cx="77" cy="93" r="4.2" fill="#ffb800"/><circle cx="76" cy="104" r="4.2" fill="#2fc874"/>
  </g>
  <!-- the hoof holding it from below -->
  <ellipse cx="28" cy="95" rx="7.5" ry="9" transform="rotate(-20 28 95)" fill="#fff4ea" stroke="#d9b39b" stroke-width="2"/>
  <!-- brush held up in the right hoof, bristles out past the body -->
  <g transform="translate(92 94) rotate(32)">
    <rect x="-3" y="-40" width="6" height="34" rx="3" fill="#b06a35"/>
    <rect x="-3.6" y="-46" width="7.2" height="7" rx="1.5" fill="#b9c0cf"/>
    <path d="M-3.6 -46 q-1 -8 3.6 -14 q4.6 6 3.6 14 z" fill="#ff3f6c"/>
  </g>
  <ellipse cx="91" cy="95" rx="7.5" ry="9.5" transform="rotate(24 91 95)" fill="#fff4ea" stroke="#d9b39b" stroke-width="2"/>
</svg>
